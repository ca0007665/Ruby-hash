<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点灯游戏 - 红宝石#</title>
    <link rel="icon" type="image/png" href="../assets/texture/icon.png">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        :root {
            --won: #fee;
            --won-shadow: #fcc9;
        }
        body {
            background-color: var(--gray-100);
        }
        main {
            display: flex;
            align-items: center;
            text-align: center;
            padding-top: 64px;
            min-height: 100vh;
        }

        .game-wrapper {
            width: fit-content;
        }
        .game-card {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            padding: 2rem 2.5rem;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.4rem;
            transition: box-shadow var(--transition), background-color var(--transition);
        }
        .game-card.won {
            background-color: var(--won);
            box-shadow: 0 4px 20px var(--won-shadow);
        }

        /* 工具按钮 */
        .tools-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            padding: 0.2rem;
            aspect-ratio: 1;
            border-radius: 50%;
            color: var(--gray-600);
            transition: var(--transition);
            line-height: 1;
        }
        .tools-btn:hover {
            background: var(--gray-100);
            color: var(--primary);
        }

        /* 遮罩层 */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .drawer-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 抽屉面板 */
        .drawer {
            position: fixed;
            top: 0;
            right: -320px;          /* 初始隐藏在右侧 */
            width: 300px;
            max-width: 85vw;
            height: 100%;
            background: var(--white);
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
            z-index: 1001;
            transition: right 0.3s ease;
            display: flex;
            flex-direction: column;
            border-radius: var(--radius) 0 0 var(--radius);
        }
        .drawer.active {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--gray-200);
            font-weight: 600;
            font-size: 1.1rem;
        }

        .drawer-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--gray-500);
            line-height: 1;
            padding: 0;
        }
        .drawer-close:hover {
            color: var(--primary);
        }

        .drawer-body {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .drawer-btn {
            width: 100%;
            justify-content: center;
        }

        .drawer-hint {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 0.5rem;
        }

        /* 尺寸选择按钮 */
        .size-selector {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .size-btn {
            font-family: monospace, sans-serif;
            padding: 0.45rem 1rem;
            border-radius: 50px;
            border: 1.5px solid var(--gray-200);
            background: var(--white);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--gray-600);
            transition: var(--transition);
            white-space: nowrap;
        }
        .size-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--gray-50);
        }
        .size-btn.active {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            font-weight: 600;
        }
        .size-btn:active {
            transform: scale(0.95);
        }

        /* 主容器 */
        .main {
            width: 100%;
            text-align: center;
        }
        .main > *:not(:last-child) {
            margin-bottom: 10px;
        }
        #size {
            display: inline-block;
            font-family: monospace, sans-serif;
            font-size: 1.2rem;
            color: var(--gray-600);
            background: var(--gray-100);
            padding: 0.2rem 0.8rem;
            border-radius: var(--radius);
            border: 1px solid var(--gray-200);
        }

        /* 棋盘容器 */
        .board-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1;
        }
        .board {
            display: grid;
            gap: 3px;
            width: 100%;
            height: 100%;
            padding: 6px;
            background: var(--gray-900);
            border-radius: var(--radius);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        /* 不同尺寸的棋盘模板 */
        .board.size-3 {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 10px;
        }
        .board.size-6 {
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 3px;
            padding: 7px;
        }
        .board.size-8 {
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 2px;
            padding: 7px;
        }
        .board.size-10 {
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 2px;
            padding: 4px;
        }

        /* 单个格子 */
        .cell {
            border-radius: 3px;
            cursor: pointer;
            transition: background-color var(--transition), transform 0.1s ease;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            aspect-ratio: 1;
            background: var(--gray-600);
        }
        .cell:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
            z-index: 2;
        }
        /* 灭灯状态 */
        .cell.off {
            background: var(--gray-600);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
        }
        .cell.off:hover {
            background: #6b7280;
        }
        .cell.off:active {
            transform: scale(0.92);
        }
        /* 亮灯状态 */
        .cell.on {
            background: var(--primary);
            box-shadow: 0 0 8px rgba(204, 51, 51, 0.5);
        }
        .cell.on:hover {
            background: var(--primary-dark);
        }
        .cell.on:active {
            transform: scale(0.92);
        }

        /* 步数计数器 */
        .move-counter {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--gray-600);
            background: var(--gray-50);
            padding: 0.4rem 1.2rem;
            border-radius: 50px;
            border: 1px solid var(--gray-200);
        }
        .move-counter .count {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gray-900);
            text-align: center;
            line-height: 1;
        }

        /* 底部按钮行 */
        .btn-row {
            display: flex;
            gap: 0.7rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .game-btn {
            padding: 0.6rem 1.4rem;
            border-radius: 50px;
            border: 1.5px solid var(--gray-200);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            transition: var(--transition);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--white);
            color: var(--gray-900);
        }
        .game-btn:hover:not(:disabled) {
            background: var(--gray-50);
            border-color: var(--gray-400);
        }
        .game-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .btn-undo:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-new-game {
            background: var(--primary);
            color: var(--white);
            border-color: var(--primary);
            font-weight: 600;
        }
        .btn-new-game:hover:not(:disabled) {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .btn-icon {
            font-size: 1.1rem;
            line-height: 1;
        }
        @media (max-width: 432px) and (min-width: 358px) {
            .size-selector > *:last-child {
                display: none;
            }
        }
        @media (max-width: 300px) {
            .error {
                display: flex;
            }
            body > :not(.error) {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="error">
        <p>抱歉，屏幕太小</p>
    </div>
    <!-- 导航栏 -->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="#" class="logo">
                <img src="../assets/texture/icon.png" class="icon">
                Ruby#
            </a>
        </nav>
    </header>

    <!-- 游戏主体区域 -->
    <main>
        <div class="game-wrapper container">
            <div class="game-card" id="gameCard">
                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                    <h2 style="margin:0;">点灯游戏</h2>
                    <button class="tools-btn" id="toolsBtn" title="导入/导出">⚙️</button>
                </div>

                <!-- 棋盘尺寸切换按钮 -->
                <div class="size-selector" id="sizeSelector">
                    <button class="size-btn active" data-size="3">Easy</button>
                    <button class="size-btn" data-size="6">Hard</button>
                    <button class="size-btn" data-size="8">Expert</button>
                    <button class="size-btn" data-size="10">Hell</button>
                </div>

                <div class="main">
                    <div id="size">3x3</div>

                    <!-- 棋盘容器 -->
                    <div class="board-container">
                        <div class="board size-6" id="board"></div>
                    </div>

                    <!-- 当前步数显示 -->
                    <div class="move-counter">
                        步数 <span class="count" id="moveCount">0</span>
                    </div>
                </div>

                <!-- 操作按钮 -->
                <div class="btn-row">
                    <button class="game-btn btn-undo" id="btnUndo" disabled>↩ 撤销</button>
                    <button class="game-btn btn-new-game" id="btnNewGame">↻ 新游戏</button>
                </div>
            </div>
        </div>

        <!-- 右侧抽屉面板 -->
        <div class="drawer-overlay" id="drawerOverlay"></div>
        <div class="drawer" id="drawer">
            <div class="drawer-header">
                <span>工具</span>
                <button class="drawer-close" id="drawerClose">&times;</button>
            </div>
            <div class="drawer-body">
                <button class="game-btn drawer-btn" id="btnExportDrawer">📤 导出游戏</button>
                <button class="game-btn drawer-btn" id="btnImportDrawer">📥 导入游戏</button>
                <input type="file" id="importFileDrawer" accept=".json" hidden>
                <p class="drawer-hint">导出会保存当前状态为 JSON 文件；导入可恢复之前的游戏。</p>
            </div>
        </div>
    </main>

    <script>
        (function() {
            // ---------- DOM 元素 ----------
            const Size = document.getElementById('size');
            const boardEl = document.getElementById('board');
            const moveCountEl = document.getElementById('moveCount');
            const btnUndo = document.getElementById('btnUndo');
            const btnNewGame = document.getElementById('btnNewGame');
            const sizeSelector = document.getElementById('sizeSelector');
            const gameCard = document.getElementById('gameCard');

            const toolsBtn = document.getElementById('toolsBtn');
            const drawer = document.getElementById('drawer');
            const drawerOverlay = document.getElementById('drawerOverlay');
            const drawerClose = document.getElementById('drawerClose');
            const btnExportDrawer = document.getElementById('btnExportDrawer');
            const btnImportDrawer = document.getElementById('btnImportDrawer');
            const importFileDrawer = document.getElementById('importFileDrawer');

            // ---------- 游戏状态 ----------
            let gridSize = 3;               // 当前棋盘尺寸
            let boardState = [];            // 二维布尔数组，true=亮，false=灭
            let moveHistory = [];           // 记录每次点击的坐标 {row, col}
            let isWon = false;              // 是否已胜利
            let onCnt = 0;                  // 亮灯数量

            // 初始化棋盘状态（全灭，清空历史）
            function initBoard(size) {
                gridSize = size;
                boardState = Array.from({ length: size }, () => Array(size).fill(true));
                onCnt = size * size;
                moveHistory = [];
                isWon = false;
                updateMoveDisplay();
                updateUndoButton();
                gameCard.classList.remove('won');
            }

            // 翻转单个格子（边界检查）
            function flipCell(row, col) {
                if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
                    boardState[row][col] = !boardState[row][col];
                    return boardState[row][col] - !boardState[row][col];
                }
                return 0;
            }

            // 点击格子：翻转自身及上下左右相邻格子
            function toggleAt(row, col) {
                let res = 0;
                res += flipCell(row, col);
                res += flipCell(row - 1, col);
                res += flipCell(row + 1, col);
                res += flipCell(row, col - 1);
                res += flipCell(row, col + 1);
                return res;
            }

            // 随机打乱棋盘（通过随机点击生成题目）
            function shuffleBoard() {
                boardState = Array.from({ length: gridSize }, () => Array(gridSize).fill(true));
                onCnt = gridSize * gridSize;
                let limit_min = Math.floor(gridSize * gridSize / 3);
                let limit_max = limit_min * 2;
                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        const flip = Math.floor(Math.random() * 2);
                        if(flip) onCnt += toggleAt(r, c);
                    }
                }
                while (onCnt < limit_min || onCnt > limit_max) {
                    const r = Math.floor(Math.random() * gridSize);
                    const c = Math.floor(Math.random() * gridSize);
                    onCnt += toggleAt(r, c);
                }
            }

            // 检查是否所有格子都点亮
            function checkAllLit() {
                return onCnt === gridSize * gridSize;
            }

            // 根据 boardState 重新渲染整个棋盘
            function renderBoard() {
                boardEl.className = 'board size-' + gridSize;
                boardEl.innerHTML = '';
                for (let r = 0; r < gridSize; r++) {
                    for (let c = 0; c < gridSize; c++) {
                        const cell = document.createElement('button');
                        cell.className = 'cell ' + (boardState[r][c] ? 'on' : 'off');
                        cell.dataset.row = r;
                        cell.dataset.col = c;
                        cell.addEventListener('click', () => handleCellClick(r, c, cell));
                        cell.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            handleCellClick(r, c, cell);
                        }, { passive: false });
                        boardEl.appendChild(cell);
                    }
                }
            }

            // 仅更新单个格子的视觉样式（优化性能）
            function updateCellVisual(row, col) {
                const index = row * gridSize + col;
                const cell = boardEl.children[index];
                if (cell) {
                    cell.className = 'cell ' + (boardState[row][col] ? 'on' : 'off');
                }
            }

            // 处理格子点击
            function handleCellClick(row, col, cellElement) {
                if (isWon) return;  // 胜利后不再响应点击

                onCnt += toggleAt(row, col);
                moveHistory.push({ row, col });
                updateMoveDisplay();
                updateUndoButton();

                // 更新受影响格子（自身及相邻）
                const affected = [
                    [row, col],
                    [row - 1, col],
                    [row + 1, col],
                    [row, col - 1],
                    [row, col + 1]
                ];
                for (const [r, c] of affected) {
                    if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
                        updateCellVisual(r, c);
                    }
                }

                // 胜利检测
                if (checkAllLit()) {
                    isWon = true;
                    gameCard.classList.add('won');
                    updateUndoButton();
                }
            }

            // 更新步数显示
            function updateMoveDisplay() {
                moveCountEl.textContent = moveHistory.length;
            }

            // 更新撤销按钮状态
            function updateUndoButton() {
                btnUndo.disabled = moveHistory.length === 0 || isWon;
            }

            // 撤销上一步
            function undo() {
                if (moveHistory.length === 0 || isWon) return;
                const last = moveHistory.pop();
                onCnt += toggleAt(last.row, last.col);
                const affected = [
                    [last.row, last.col],
                    [last.row - 1, last.col],
                    [last.row + 1, last.col],
                    [last.row, last.col - 1],
                    [last.row, last.col + 1]
                ];
                for (const [r, c] of affected) {
                    if (r >= 0 && r < gridSize && c >= 0 && c < gridSize) {
                        updateCellVisual(r, c);
                    }
                }
                updateMoveDisplay();
                updateUndoButton();
            }

            // 开始新游戏
            function newGame() {
                initBoard(gridSize);
                shuffleBoard();
                renderBoard();
                updateMoveDisplay();
                updateUndoButton();
                gameCard.classList.remove('won');
            }

            // 切换棋盘尺寸
            function changeSize(newSize) {
                if (newSize === gridSize && moveHistory.length === 0 && !isWon) return;
                gridSize = newSize;
                initBoard(gridSize);
                shuffleBoard();
                renderBoard();
                updateMoveDisplay();
                updateUndoButton();
                gameCard.classList.remove('won');
                // 更新尺寸按钮激活状态
                document.querySelectorAll('.size-btn').forEach(b => {
                    b.classList.toggle('active', parseInt(b.dataset.size) === gridSize);
                });
                // 更新#size元素
                Size.textContent = `${newSize}x${newSize}`;
            }

            // ---------- 事件绑定 ----------
            btnUndo.addEventListener('click', undo);
            btnNewGame.addEventListener('click', newGame);

            sizeSelector.addEventListener('click', (e) => {
                const btn = e.target.closest('.size-btn');
                if (!btn) return;
                const size = parseInt(btn.dataset.size);
                changeSize(size);
            });

            // 键盘快捷键：Ctrl+Z 撤销，R 新游戏
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    undo();
                }
                if (e.key === 'r' && !e.ctrlKey && !e.metaKey && document.activeElement === document.body) {
                    e.preventDefault();
                    newGame();
                }
            });

            // 游戏启动
            function startGame() {
                initBoard(gridSize);
                shuffleBoard();
                renderBoard();
                document.querySelectorAll('.size-btn').forEach(b => {
                    b.classList.toggle('active', parseInt(b.dataset.size) === gridSize);
                });
            }

            startGame();

            // ---------- 导入/导出 ----------
            // 抽屉开关逻辑
            function openDrawer() {
                drawer.classList.add('active');
                drawerOverlay.classList.add('active');
            }
            function closeDrawer() {
                drawer.classList.remove('active');
                drawerOverlay.classList.remove('active');
            }

            // 导入导出
            function exportGame() {
                const saveData = {
                    gridSize: gridSize,
                    boardState: boardState,
                    moveHistory: moveHistory,
                    isWon: isWon
                };
                const jsonStr = JSON.stringify(saveData, null, 2);
                const blob = new Blob([jsonStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `light-game-${gridSize}x${gridSize}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
            function importGame(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        // 数据校验
                        if (!data || typeof data.gridSize !== 'number' || !Array.isArray(data.boardState)) {
                            throw new Error('数据格式不正确');
                        }
                        if (data.boardState.length !== data.gridSize ||
                            !data.boardState.every(row => Array.isArray(row) && row.length === data.gridSize)) {
                            throw new Error('棋盘数据与尺寸不匹配');
                        }

                        // 恢复游戏状态
                        gridSize = data.gridSize;
                        boardState = data.boardState;
                        moveHistory = Array.isArray(data.moveHistory) ? data.moveHistory : [];
                        isWon = !!data.isWon;
                        onCnt = boardState.flat().filter(v => v).length;  // 重新计算亮灯数

                        // 更新 UI
                        document.querySelectorAll('.size-btn').forEach(b => {
                            b.classList.toggle('active', parseInt(b.dataset.size) === gridSize);
                        });
                        Size.textContent = `${gridSize}x${gridSize}`;
                        renderBoard();
                        updateMoveDisplay();
                        updateUndoButton();
                        gameCard.classList.toggle('won', isWon);
                    } catch (error) {
                        alert('导入失败：' + error.message);
                    }
                };
                reader.readAsText(file);
            }

            toolsBtn.addEventListener('click', openDrawer);
            drawerClose.addEventListener('click', closeDrawer);
            drawerOverlay.addEventListener('click', closeDrawer);

            // 导出功能
            btnExportDrawer.addEventListener('click', () => {
                exportGame();
            });

            // 导入功能
            btnImportDrawer.addEventListener('click', () => {
                importFileDrawer.click();
            });
            importFileDrawer.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    importGame(e.target.files[0]);
                    importFileDrawer.value = '';
                    closeDrawer();   // 导入成功后关闭抽屉
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeDrawer();
                }
            });
        })();
    </script>
</body>
</html>
